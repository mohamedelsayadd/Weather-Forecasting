[project]
name = "time-series-foarcasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "chronos-forecasting[extras]>=2.2.2",
    "darts>=0.44.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "timezonefinder>=8.2.4",
    "transformers>=4.57.6",
    "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
